name: CI
 
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
 
permissions:
  contents: read
 
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
        env:
          CI: true
      - name: Build
        run: npm run build